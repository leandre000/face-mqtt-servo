<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face-Locked Servo Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .team-badge {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        padding: 8px 16px;
        border-radius: 25px;
        display: inline-block;
        font-weight: bold;
        margin-top: 10px;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
      }

      .card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .status-indicator {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .led {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 10px;
        animation: pulse 2s infinite;
      }

      .led.green {
        background: #4caf50;
        box-shadow: 0 0 10px #4caf50;
      }

      .led.red {
        background: #f44336;
        box-shadow: 0 0 10px #f44336;
      }

      .led.yellow {
        background: #ff9800;
        box-shadow: 0 0 10px #ff9800;
      }

      .state-box {
        background: #f5f5f5;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .state-title {
        color: #666;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .state-value {
        font-size: 2em;
        font-weight: bold;
        margin: 10px 0;
      }

      .movement-left {
        color: #2196f3;
      }

      .movement-right {
        color: #f44336;
      }

      .movement-centered {
        color: #4caf50;
      }

      .movement-no-face {
        color: #9e9e9e;
      }

      .timestamp {
        color: #999;
        font-size: 0.85em;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #eee;
      }

      .servo-visual {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: 20px;
      }

      .servo-pointer {
        width: 100px;
        height: 4px;
        background: #ddd;
        position: relative;
        border-radius: 2px;
      }

      .servo-pointer::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: #667eea;
        border-radius: 50%;
        top: -8px;
        transition: left 0.3s ease;
      }

      .servo-pointer.left::after {
        left: 0%;
      }
      .servo-pointer.center::after {
        left: 50%;
        transform: translateX(-50%);
      }
      .servo-pointer.right::after {
        left: 100%;
        transform: translateX(-100%);
      }

      .connection-status {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: bold;
        margin-top: 10px;
      }

      .connected {
        background: #4caf50;
        color: white;
      }

      .disconnected {
        background: #f44336;
        color: white;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        color: white;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎯 Face-Locked Servo Control</h1>
        <p style="color: #666; margin-bottom: 15px">
          Real-time monitoring dashboard - Phase 1 (Open-Loop)
        </p>
        <span class="team-badge" id="team-badge">Team: team351</span>
        <span id="connection-status" class="connection-status disconnected"
          >Disconnected</span
        >
      </div>

      <div class="dashboard" id="dashboard">
        <!-- Cards will be populated by JavaScript -->
      </div>

      <div class="footer">
        <p>
          Distributed Vision-Control System | MQTT + WebSocket Real-time Updates
        </p>
        <p style="font-size: 0.9em; margin-top: 10px">
          Phase 1: Open-Loop Actuation
        </p>
      </div>
    </div>

    <script>
      // Configuration
      const TEAM_ID = "team351"; // Change to your team_id
      const WS_URL = `ws://${window.location.hostname}:9002`;

      // DOM elements
      const dashboardEl = document.getElementById("dashboard");
      const connectionStatusEl = document.getElementById("connection-status");
      const teamBadgeEl = document.getElementById("team-badge");

      // Update team badge
      teamBadgeEl.textContent = `Team: ${TEAM_ID}`;

      // State colors and labels
      const stateConfig = {
        MOVE_LEFT: {
          color: "#2196F3",
          label: "← MOVE LEFT",
          class: "movement-left",
        },
        MOVE_RIGHT: {
          color: "#f44336",
          label: "→ MOVE RIGHT",
          class: "movement-right",
        },
        CENTERED: {
          color: "#4CAF50",
          label: "● CENTERED",
          class: "movement-centered",
        },
        NO_FACE: {
          color: "#9E9E9E",
          label: "○ NO FACE",
          class: "movement-no-face",
        },
      };

      // Create team card
      function createTeamCard(teamId, data = null) {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${teamId}`;

        const status = data?.status || "NO_FACE";
        const config = stateConfig[status] || stateConfig["NO_FACE"];
        const timestamp = data?.timestamp
          ? new Date(data.timestamp * 1000)
          : new Date();
        const timeStr = timestamp.toLocaleTimeString();

        let servoClass = "center";
        if (status === "MOVE_LEFT") servoClass = "left";
        if (status === "MOVE_RIGHT") servoClass = "right";

        card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: #333; margin: 0;">${teamId}</h2>
                    <div class="status-indicator">
                        <div class="led ${status === "NO_FACE" ? "red" : "green"}"></div>
                        <span>${status === "NO_FACE" ? "No Face" : "Tracking"}</span>
                    </div>
                </div>
                
                <div class="state-box">
                    <div class="state-title">Current Movement State</div>
                    <div class="state-value ${config.class}">${config.label}</div>
                    <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                        <span style="color: #666;">Confidence:</span>
                        <span style="font-weight: bold;">${data?.confidence ? (data.confidence * 100).toFixed(0) : 0}%</span>
                    </div>
                </div>
                
                <div class="servo-visual">
                    <span style="color: #2196F3; font-weight: bold;">LEFT</span>
                    <div class="servo-pointer ${servoClass}"></div>
                    <span style="color: #f44336; font-weight: bold;">RIGHT</span>
                </div>
                
                <div class="timestamp">
                    <strong>Last Update:</strong> ${timeStr}<br>
                    <span style="font-size: 0.9em;">System Online • Real-time via WebSocket</span>
                </div>
            `;

        return card;
      }

      // Update team card
      function updateTeamCard(teamId, data) {
        const card = document.getElementById(`card-${teamId}`);
        if (card) {
          const newCard = createTeamCard(teamId, data);
          card.parentNode.replaceChild(newCard, card);
        } else {
          const dashboard = document.getElementById("dashboard");
          dashboard.appendChild(createTeamCard(teamId, data));
        }
      }

      // Initialize WebSocket connection
      function initWebSocket() {
        console.log(`[WebSocket] Connecting to ${WS_URL}...`);

        const ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          console.log("[WebSocket] Connected");
          connectionStatusEl.textContent = "Connected";
          connectionStatusEl.className = "connection-status connected";
        };

        ws.onclose = () => {
          console.log("[WebSocket] Disconnected, reconnecting in 2s...");
          connectionStatusEl.textContent = "Disconnected (reconnecting...)";
          connectionStatusEl.className = "connection-status disconnected";
          setTimeout(initWebSocket, 2000);
        };

        ws.onerror = (error) => {
          console.error("[WebSocket] Error:", error);
        };

        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);

            if (message.type === "initial_state") {
              console.log("[WebSocket] Received initial state:", message.data);
              Object.entries(message.data).forEach(([teamId, data]) => {
                updateTeamCard(teamId, data);
              });
            }

            if (message.type === "movement_update") {
              console.log(
                `[WebSocket] Movement update for ${message.team}:`,
                message.data,
              );
              updateTeamCard(message.team, message.data);
            }
          } catch (error) {
            console.error("[WebSocket] Error parsing message:", error);
          }
        };
      }

      // Start WebSocket connection
      initWebSocket();
    </script>
  </body>
</html>
